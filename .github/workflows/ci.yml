name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.compiler }} / C++${{ matrix.standard }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++, standard: 17, build_type: Debug }
          - { compiler: gcc, cxx: g++, standard: 20, build_type: Debug }
          - { compiler: clang, cxx: clang++, standard: 17, build_type: Debug }
          - { compiler: clang, cxx: clang++, standard: 20, build_type: Debug }
          - { compiler: gcc, cxx: g++, standard: 20, build_type: Release }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
            -DLZHLIB_BUILD_GTEST=ON

      - name: Build
        run: cmake --build build --target lzhlib_unit_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.sanitizer }} (gcc, C++17)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=17 \
            -DLZHLIB_BUILD_GTEST=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build --target lzhlib_unit_tests

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
