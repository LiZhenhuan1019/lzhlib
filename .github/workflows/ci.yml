name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.compiler }} / C++${{ matrix.standard }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++, standard: 17, build_type: Debug }
          - { compiler: gcc, cxx: g++, standard: 20, build_type: Debug }
          - { compiler: clang, cxx: clang++, standard: 17, build_type: Debug }
          - { compiler: clang, cxx: clang++, standard: 20, build_type: Debug }
          - { compiler: gcc, cxx: g++, standard: 20, build_type: Release }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
            -DLZHLIB_BUILD_GTEST=ON

      - name: Build
        run: cmake --build build --target lzhlib_unit_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure

  warnings:
    name: warnings as errors (${{ matrix.cxx }}, C++20)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++ }
          - { compiler: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            -DLZHLIB_BUILD_GTEST=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build --target lzhlib_unit_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Sanitizer runtimes fight with the 32 bit ASLR entropy of newer kernels
      # ("DEADLYSIGNAL" spam from ASan, "unexpected memory mapping" from TSan),
      # so the tests are started through `setarch -R`.
      matrix:
        include:
          # ASan catches use-after-free / out-of-bounds / leaks, UBSan catches
          # signed overflow, invalid casts and friends. Both are compiled into
          # the same binary.
          - name: ASan + UBSan (gcc, C++17)
            flags: -fsanitize=address,undefined
            ctest_cmd: setarch $(uname -m) -R ctest
          # TSan reports data races.
          - name: TSan (gcc, C++17)
            flags: -fsanitize=thread
            ctest_cmd: setarch $(uname -m) -R ctest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=17 \
            -DLZHLIB_BUILD_GTEST=ON \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }} -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --target lzhlib_unit_tests

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ${{ matrix.ctest_cmd }} --test-dir build --output-on-failure
